<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas</title>
    <link href="css/bootstrap/bootstrap.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Sorteador de Times</a>

            <button class="navbar-toggler" type="text/button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-line"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="torneios.html">Torneios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="jogadores.html">Jogadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="times.html">Times</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="partidas.html">Partidas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="tab-content border p-3">
            <h1 class="border-bottom text-center my-3">Partidas</h1>

            <p id="torneioPartidasAtual">
                Nenhum torneio selecionado.
            </p>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="confirmoNovosConfrontos">

                <label class="form-check-label" for="confirmoNovosConfrontos">
                    Substituir os confrontos atuais (necessário se já houver confrontos preparados)
                </label>
            </div>

            <div class="mb-3">
                <button type="button" class="btn btn-primary" id="botaoPrepararConfrontos" onclick="prepararConfrontos()">
                    Preparar confrontos
                </button>
            </div>

            <p id="mensagemPartidas" class="mt-3" role="status"></p>

            <h2 class="border-bottom my-2">Confrontos</h2>

            <div class="table-responsive">
                <table class="table table-striped" id="tabelaPartidas">
                    <thead class="table-dark">
                        <tr>
                            <th>Rodada</th>
                            <th>Time A</th>
                            <th>Time B</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="3">Selecione um torneio primeiro.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script type="text/javascript" src="js/bootstrap/bootstrap.js"></script>
    <script type="text/javascript" src="js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/biblioteca.js"></script>
    <script type="text/javascript" src="js/partidas.js"></script>
</body>

</html>
