<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogadores</title>
    <link href="css/bootstrap/bootstrap.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Sorteador de Times</a>

            <button class="navbar-toggler" type="text/button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-line"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="torneios.html">Torneios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="jogadores.html">Jogadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="times.html">Times</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="partidas.html">Partidas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="tab-content border p-3">
            <h1 class="border-bottom text-center my-3">Jogadores</h1>
            <p id="torneioAtual">Nenhum torneio selecionado.</p>
            <h2 class="border-bottom my-2">Cadastrar jogador</h2>

            <form id="formJogador" onsubmit="cadastrarJogador(event)">

                <div class="mb-3">
                    <label for="codigoJogador" class="form-label">
                        Código do jogador (não pode repetir neste torneio)
                    </label>

                    <input type="text" class="form-control" id="codigoJogador" name="codigo" placeholder="Ex.: J01"
                        required>
                </div>

                <div class="mb-3">
                    <label for="nomeJogador" class="form-label">
                        Nome do jogador
                    </label>

                    <input type="text" class="form-control" id="nomeJogador" name="nome" placeholder="Ex.: João"
                        required>
                </div>

                <div class="mb-3">
                    <label for="numeroCamisa" class="form-label">
                        Número da camisa
                    </label>

                    <input type="number" class="form-control" id="numeroCamisa" name="numeroCamisa" min="1" step="1"
                        required>
                </div>

                <div class="mb-3">
                    <label for="pontuacaoJogador" class="form-label">
                        Pontuação
                    </label>

                    <input type="number" class="form-control" id="pontuacaoJogador" name="pontuacao" min="1" step="1"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Cadastrar jogador
                </button>

            </form>

            <p id="mensagemJogador" class="text-primary mt-3" role="status"></p>

            <h2 class="border-bottom my-2">Pesquisar jogadores</h2>

            <form id="formPesquisaJogador" onsubmit="pesquisarJogadores(event)">

                <div class="mb-3">
                    <label for="pesquisaJogador" class="form-label">
                        Nome do jogador (digite o nome inteiro; vazio mostra todos)
                    </label>

                    <input type="text" class="form-control" id="pesquisaJogador"
                        placeholder="Digite o nome do jogador...">
                </div>

                <button type="submit" class="btn btn-primary">
                    Pesquisar
                </button>

            </form>

            <div class="table-responsive mt-3">
                <table class="table table-striped" id="tabelaJogadores">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Núm. camisa</th>
                            <th>Pontuação</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>
            </div>

            <h2 class="border-bottom my-2">Selecionar ou excluir jogador</h2>

            <div class="mb-3">
                <label for="codigoAcaoJogador" class="form-label">
                    Código do jogador
                </label>

                <input type="text" class="form-control" id="codigoAcaoJogador"
                    placeholder="Digite o código de um jogador da tabela">
            </div>

            <button type="button" class="btn btn-primary" id="botaoSelecionarJogador" onclick="selecionarJogador()">
                Selecionar
            </button>

            <button type="button" class="btn btn-danger" id="botaoExcluirJogador" onclick="excluirJogador()">
                Excluir
            </button>

            <div class="form-check mt-2">
                <input type="checkbox" class="form-check-input" id="confirmoExclusaoJogador">

                <label class="form-check-label" for="confirmoExclusaoJogador">
                    Confirmo a exclusão (não pode ser desfeita)
                </label>
            </div>

            <p id="mensagemAcaoJogador" class="mt-3" role="status"></p>

            <p id="jogadorSelecionadoMensagem" class="mt-3">
                Nenhum jogador selecionado.
            </p>

            <h2 class="border-bottom my-2">Editar jogador</h2>

            <form id="formEdicaoJogador" onsubmit="salvarEdicaoJogador(event)">

                <fieldset id="camposEdicaoJogador" disabled>

                    <div class="mb-3">
                        <label for="editarNomeJogador" class="form-label">
                            Nome do jogador
                        </label>

                        <input type="text" class="form-control" id="editarNomeJogador" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarNumeroCamisa" class="form-label">
                            Número da camisa
                        </label>

                        <input type="number" class="form-control" id="editarNumeroCamisa" min="1" step="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarPontuacaoJogador" class="form-label">
                            Pontuação
                        </label>

                        <input type="number" class="form-control" id="editarPontuacaoJogador" min="1" step="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>

                </fieldset>

            </form>

            <p id="mensagemEdicaoJogador" class="mt-3" role="status"></p>

        </div>
    </div>

    <script type="text/javascript" src="js/bootstrap/bootstrap.js"></script>
    <script type="text/javascript" src="js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/biblioteca.js"></script>
    <script type="text/javascript" src="js/jogadores.js"></script>
</body>

</html>
